services:
  - type: web
    name: soundcache-backend
    runtime: node
    plan: free
    rootDir: api
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: MONGODB_URI
        sync: false # Connect your free MongoDB Atlas URI in the Render dashboard
